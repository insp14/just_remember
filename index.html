<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JUST REMEMBER</title>
    <style>
        @font-face {
            font-family: 'DOSFont';
            src: url('DOSFont.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fff;
            color: #000;
            font-family: 'DOSFont', monospace;
            font-size: 22px;
            line-height: 1.4;
            cursor: pointer;
            min-height: 100vh;
            padding: 60px 40px;
            padding-top: 140px;
        }

        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 12px 24px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 200;
        }

        #menu-btn {
            background: transparent;
            border: 1px solid #000;
            color: #000;
            padding: 6px 18px;
            font-family: 'DOSFont', monospace;
            font-size: 14px;
            cursor: pointer;
        }

        #menu-btn:hover {
            background: #000;
            color: #fff;
        }

        #title-block {
            text-align: center;
            margin-bottom: 50px;
        }

        .title-line {
            border: none;
            border-top: 2px solid #000;
            margin: 20px auto;
            width: 80%;
        }

        #title {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #000;
        }

        #game-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .paragraph {
            margin-bottom: 24px;
            white-space: pre-wrap;
            min-height: 1.6em;
        }

        .cursor {
            display: inline-block;
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="topbar">
        <button id="menu-btn">Меню</button>
    </div>
    <div id="title-block">
        <hr class="title-line">
        <div id="title">JUST REMEMBER</div>
        <hr class="title-line">
    </div>
    <div id="game-container"></div>

    <script>
        const paragraphs = [
            "Просто представьте: вы скитаетесь по пустому бесконечному пространству с какой-то целью, но вы идете так долго, что забыли – для чего это делаете или вернее почему?",
            "В руках у Вас странный предмет, напоминающий стеклянный короб, в котором находится непонятный кусок бумаги, на котором что-то написано, но разобрать что именно – невозможно.",
            "Открыть его является непосильной задачей. Разбить – вокруг пустота и ничего более, нет ни чего-то острого, ни чего-то твердого. Все мягкое и спокойное.",
            "Кажется, то, что находится внутри – это и есть ключ к пониманию того, что тут случилось, ключ к объяснению всего происходящего. Надежда угасла уже давно.",
            "Все дальнейшие похождения – просто привычка. Любые чувства, эмоции притупились максимально. Ни страха, ни сожаления, ни радости, ни удовлетворения. Это испытание, которое уже, казалось, было провалено."
        ];

        let currentIndex = 0;
        let isTyping = false;
        let typingInterval = null;
        const container = document.getElementById('game-container');

        function typeParagraph(text) {
            isTyping = true;

            const p = document.createElement('div');
            p.className = 'paragraph';
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            cursor.textContent = '_';
            p.appendChild(cursor);
            container.appendChild(p);

            let charIndex = 0;
            const speed = 30;

            typingInterval = setInterval(() => {
                if (charIndex < text.length) {
                    const char = document.createTextNode(text[charIndex]);
                    p.insertBefore(char, cursor);
                    charIndex++;
                } else {
                    clearInterval(typingInterval);
                    cursor.remove();
                    isTyping = false;
                }
            }, speed);
        }

        function skipTyping() {
            clearInterval(typingInterval);
            const lastP = container.lastElementChild;
            if (lastP) {
                lastP.textContent = paragraphs[currentIndex - 1];
            }
            isTyping = false;
        }

        document.body.addEventListener('click', () => {
            if (isTyping) {
                skipTyping();
            } else if (currentIndex < paragraphs.length) {
                typeParagraph(paragraphs[currentIndex]);
                currentIndex++;
            }
        });
    </script>
</body>
</html>
