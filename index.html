<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JUST REMEMBER</title>
    <style>
        @font-face {
            font-family: 'DOSFont';
            src: url('DOSFont.ttf') format('truetype');
        }

        :root {
            --bg-color: #fff;
            --text-color: #000;
            --border-color: #000;
            --topbar-bg: rgba(255, 255, 255, 0.8);
            --topbar-border: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'DOSFont', monospace;
            font-size: 20px;
            line-height: 1.4;
            cursor: pointer;
            min-height: 100vh;
            padding: 60px 40px;
            padding-top: 140px;
            transition: background-color 0.3s, color 0.3s;
        }

        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--topbar-bg);
            border-bottom: 1px solid var(--topbar-border);
            padding: 12px 24px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 200;
            backdrop-filter: blur(4px);
            transition: background-color 0.3s, border-color 0.3s;
        }

        #menu-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 18px;
            font-family: 'DOSFont', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        #menu-btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .modal h2 {
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-control {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            font-family: 'DOSFont', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-control:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        .btn-control:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .btn-control:disabled:hover {
            background: transparent;
            color: var(--text-color);
        }

        #close-menu {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }

        .music-control {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .music-control label {
            font-family: 'DOSFont', monospace;
            font-size: 14px;
            color: var(--text-color);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: var(--border-color);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--text-color);
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: var(--text-color);
            border: none;
            cursor: pointer;
        }

        #title-block {
            text-align: center;
            margin-bottom: 50px;
        }

        .title-line {
            border: none;
            border-top: 2px solid var(--border-color);
            margin: 20px auto;
            width: 80%;
        }

        #title {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 4px;
            color: var(--text-color);
        }

        #game-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .paragraph {
            text-align: justify;
            margin-bottom: 12px;
            white-space: pre-wrap;
            min-height: 1.6em;
        }

        .cursor {
            display: inline-block;
            animation: blink 0.8s step-end infinite;
        }

        .choice-block {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 24px;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .choice-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 24px;
            font-family: 'DOSFont', monospace;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .choice-btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="topbar">
        <button id="menu-btn">Меню</button>
    </div>

    <!-- Затемнение и модальное окно (МЕНЮ) -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <button id="close-menu">&times;</button>
            <h2>Меню</h2>
            <div class="controls">
                <button class="btn-control" id="theme-toggle">Сменить тему</button>
                <button class="btn-control" id="rollback-btn" disabled>Откатиться к выбору</button>
                <button class="btn-control" id="music-toggle">Музыка: выкл</button>
                <div class="music-control">
                    <label for="volume-slider">Громкость</label>
                    <input type="range" id="volume-slider" min="0" max="100" value="50">
                </div>
            </div>
        </div>
    </div>

    <!-- Затемнение и модальное окно (ОБ ИГРЕ) -->
    <div class="overlay" id="intro-overlay">
        <div class="modal">
            <h2>Об игре</h2>
            <p style="margin-bottom: 24px; font-size: 16px; text-align: justify;">
                Данная текстовая игра имеет направление на сюжетную составляющую с возможностью выбора варианта развития событий, влияющих на конечный результат. Проникнитесь таинственной историей, которую прожил главный герой и получите те же эмоции, что и он. Удачи!
            </p>
            <button class="btn-control" id="intro-close">Понятно</button>
        </div>
    </div>

    <div id="title-block">
        <hr class="title-line">
        <div id="title">JUST REMEMBER</div>
        <hr class="title-line">
    </div>
    <div id="game-container"></div>

    <audio id="bg-music" loop preload="auto">
        <source src="ambient.mp3" type="audio/mpeg">
    </audio>

    <audio id="click-sound" preload="auto">
        <source src="click.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- Структура сюжета ---
        const paragraphs = [
            "Просто представьте: вы скитаетесь по пустому бесконечном пространстве с какой-то целью, но вы идете так долго, что забыли – для чего это делаете или вернее почему?",
            "В руках у Вас странный предмет, напоминающий стеклянный короб, в котором находится непонятный кусок бумаги, на котором что-то написано, но разобрать что именно – невозможно.",
            "Открыть его является непосильной задачей. Разбить – вокруг пустота и ничего более, нет ни чего-то острого, ни чего-то твердого. Все мягкое и спокойное.",
            "Кажется, то, что находится внутри – это и есть ключ к пониманию того, что тут случилось, ключ к объяснению всего происходящего. Надежда угасла уже давно.",
            "Все дальнейшие похождения – просто привычка. Любые чувства, эмоции притупились максимально. Ни страха, ни сожаления, ни радости, ни удовлетворения. Это испытание, которое уже, казалось, было провалено.",
            "После пройденных миллионов километров по пустоте, Вы обнаруживаете выделяющееся, непохожее ни на что… (???). Вы когда-нибудь видели это?",
            "Прошло столько времени, пропало какое-либо понимание происходящего, возникает лишь два вопроса: прикоснуться или опровергнуть? Погубит или поможет? Спасет или потревожит?",
            "Появляется выбор, которого не было тогда, когда он был так важен. Прикосновение в ситуации с затупленными чувствами тактильности не вызывает ни капли сомнения, страха, вообще ничего.",
            {
                type: "choice",
                options: [
                    {
                        label: "Прикоснуться",
                        result: [
                            "Вы быстро оглядываетесь по сторонам, словно чувства начинают к Вам возвращаться, и эти чувства – это страх, растерянность, непонимание. Вы боитесь – но это уже хоть что-то, что-то такое, что Вы так давно потеряли – эмоции.",
                            "Неоднократно оглянувшись, вы замечаете вокруг толпу людей, давненько Вы их не видели. Кто-то бежит от бытовой рутины, кто-то в страхе идет подозрительно оглядываясь, кто-то смеется и плачет.",
                            "Но одно странно – Вас словно не существует, Вы ощущаете как эти люди проходят Вас насквозь, словно они призраки, или все же это Вы?",
                            "Через мгновение Вы ощущаете толчок позади себя, словно Вас кто-то задел. Обернувшись, Вы видите старика, низкорослого старика с тростью и шляпой на вид из 60-ых годов.",
                            "Испытывая чувства недоумения и растерянности, Вы хотите взглянуть на то, что осталось у Вас неизменным – короб, который находился у Вас в руках. Опускаете глаза, но его у Вас нет. Кто-то украл? Но кому он нужен?",
                            "Подняв глаза, вы понимаете, что в том месте, где Вы находитесь больше нет ни одного человека, а пространство относительно меньше предыдущего.",
                            "Вам было тяжело понять что-либо, ведь буквально над Вами на расстоянии вытянутой руки в лицо светила лампа, ослепляя Вас так сильно, что попытка оглянуться и понять, где Вы находитесь увенчалась провалом.",
                            "Было ясно одно – Вы лежите. Возник лишь один вопрос: «Что тут происходит?». Всего лишь несколько секунд назад Вы стояли по середине бескрайнего пространства наполненного людьми с переменными чувствами страха и растерянности, и тут Вы резко оказываетесь в положении лежа перед напрочь ослепляющей глаза лампой."
                        ]
                    },
                    {
                        label: "Отвергнуть",
                        result: [
                            "Нет. Вы больше не верите. Все угасло уже очень давно. Вы не хотите возвращаться к этому. Но что-то или кто-то с Вами не согласен и Вы чувствуете резкий толчок позади себя...",
                            "Совершенно новое пространство. Далеко не такое пустое как предыдущее. Неизменно одно – в руках стеклянный маленький короб с таинственным куском бумаги."
                        ]
                    }
                ]
            }
        ];

        let currentIndex = 0;
        let isTyping = false;
        let typingInterval = null;
        let choiceMade = false;
        let pendingResult = null;
        let currentTypingText = '';
        let isChoiceVisible = false;
        const container = document.getElementById('game-container');

        let rollbackCheckpoint = null;
        const rollbackBtn = document.getElementById('rollback-btn');

        const bgMusic = document.getElementById('bg-music');
        const clickSound = document.getElementById('click-sound');
        const musicToggle = document.getElementById('music-toggle');
        const volumeSlider = document.getElementById('volume-slider');
        let musicPlaying = false;

        bgMusic.volume = 0.5;
        clickSound.volume = 0.5;

        function playClick() {
            if (!musicPlaying) return;
            clickSound.currentTime = 0;
            clickSound.play().catch(() => {});
        }

        // --- Логика меню ---
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menu-btn');
        const closeMenuBtn = document.getElementById('close-menu');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            playClick();
            overlay.classList.add('active');
        });

        closeMenuBtn.addEventListener('click', () => {
            playClick();
            overlay.classList.remove('active');
        });

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.classList.remove('active');
            }
        });

        // --- Окно «Об игре» (показ при каждом открытии) ---
        const introOverlay = document.getElementById('intro-overlay');
        const introCloseBtn = document.getElementById('intro-close');

        setTimeout(() => {
            introOverlay.classList.add('active');
        }, 500);

        introCloseBtn.addEventListener('click', () => {
            playClick();
            introOverlay.classList.remove('active');
        });

        introOverlay.addEventListener('click', (e) => {
            if (e.target === introOverlay) {
                playClick();
                introOverlay.classList.remove('active');
            }
        });

        document.querySelector('.modal').addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // --- Переключение темы ---
        const themeToggle = document.getElementById('theme-toggle');
        let isDark = false;

        themeToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            playClick();
            isDark = !isDark;
            const root = document.documentElement;
            if (isDark) {
                root.style.setProperty('--bg-color', '#000');
                root.style.setProperty('--text-color', '#fff');
                root.style.setProperty('--border-color', '#fff');
                root.style.setProperty('--topbar-bg', 'rgba(0, 0, 0, 0.7)');
                root.style.setProperty('--topbar-border', 'rgba(255, 255, 255, 0.3)');
            } else {
                root.style.setProperty('--bg-color', '#fff');
                root.style.setProperty('--text-color', '#000');
                root.style.setProperty('--border-color', '#000');
                root.style.setProperty('--topbar-bg', 'rgba(255, 255, 255, 0.8)');
                root.style.setProperty('--topbar-border', 'rgba(0, 0, 0, 0.3)');
            }
        });

        // --- Логика отката ---
        rollbackBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!rollbackCheckpoint) return;

            playClick();
            rollbackBtn.disabled = true;

            if (isTyping) {
                clearInterval(typingInterval);
                isTyping = false;
            }

            pendingResult = null;
            choiceMade = false;

            const keepCount = rollbackCheckpoint.containerChildCount;
            while (container.children.length > keepCount) {
                container.removeChild(container.lastChild);
            }

            currentIndex = rollbackCheckpoint.choiceIndex;

            const choiceObj = paragraphs[currentIndex];
            showChoice(choiceObj, false);

            currentIndex++;

            overlay.classList.remove('active');
        });

        // --- Логика музыки и звука ---
        musicToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            playClick();
            if (musicPlaying) {
                bgMusic.pause();
                musicPlaying = false;
                musicToggle.textContent = 'Музыка: выкл';
            } else {
                bgMusic.play().catch(err => console.log('Воспроизведение заблокировано браузером'));
                musicPlaying = true;
                musicToggle.textContent = 'Музыка: вкл';
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            e.stopPropagation();
            const vol = volumeSlider.value / 100;
            bgMusic.volume = vol;
            clickSound.volume = vol;
        });

        // --- Логика текста ---
        function typeParagraph(text) {
            isTyping = true;
            const p = document.createElement('div');
            p.className = 'paragraph';
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            cursor.textContent = '_';
            p.appendChild(cursor);
            container.appendChild(p);
            let charIndex = 0;
            const speed = 30;
            typingInterval = setInterval(() => {
                if (charIndex < text.length) {
                    const char = document.createTextNode(text[charIndex]);
                    p.insertBefore(char, cursor);
                    charIndex++;
                } else {
                    clearInterval(typingInterval);
                    cursor.remove();
                    isTyping = false;
                }
            }, speed);
        }

        function skipTyping() {
            clearInterval(typingInterval);
            const lastP = container.lastElementChild;
            if (lastP && lastP.classList.contains('paragraph')) {
                lastP.textContent = currentTypingText;
            }
            isTyping = false;
        }

        function typeParagraphTracked(text) {
            currentTypingText = text;
            typeParagraph(text);
        }

        // --- Отрисовка кнопок выбора ---
        function showChoice(choiceObj, enableRollback) {
            rollbackCheckpoint = {
                choiceIndex: currentIndex,
                containerChildCount: container.children.length
            };
            if (enableRollback) {
                rollbackBtn.disabled = false;
            }
            isChoiceVisible = true;
            const choiceBlock = document.createElement('div');
            choiceBlock.className = 'choice-block';
            choiceObj.options.forEach((option) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = option.label;
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (choiceMade) return;
                    choiceMade = true;
                    isChoiceVisible = false;
                    playClick();
                    choiceBlock.remove();
                    pendingResult = option.result.slice();
                    const firstText = pendingResult.shift();
                    typeParagraphTracked(firstText);
                });
                choiceBlock.appendChild(btn);
            });
            container.appendChild(choiceBlock);
        }

        // --- Обработка клика по экрану ---
        document.body.addEventListener('click', () => {
            if (overlay.classList.contains('active')) return;
            if (introOverlay.classList.contains('active')) return;
            if (isChoiceVisible) return;
            if (isTyping) {
                skipTyping();
                return;
            }
            if (pendingResult && pendingResult.length > 0) {
                const nextText = pendingResult.shift();
                typeParagraphTracked(nextText);
                return;
            }
            if (currentIndex < paragraphs.length) {
                const item = paragraphs[currentIndex];
                if (typeof item === 'string') {
                    typeParagraphTracked(item);
                    currentIndex++;
                } else if (item.type === "choice") {
                    showChoice(item, true);
                    currentIndex++;
                }
            }
        });
    </script>
</body>
</html>
