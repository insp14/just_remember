<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JUST REMEMBER</title>
    <style>
        @font-face {
            font-family: 'DOSFont';
            src: url('DOSFont.ttf') format('truetype');
        }

        :root {
            --bg-color: #fff;
            --text-color: #000;
            --border-color: #000;
            --topbar-bg: rgba(255, 255, 255, 0.8);
            --topbar-border: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'DOSFont', monospace;
            font-size: 20px;
            line-height: 1.4;
            cursor: pointer;
            min-height: 100vh;
            padding: 60px 40px;
            padding-top: 140px;
            transition: background-color 0.3s, color 0.3s;
        }

        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--topbar-bg);
            border-bottom: 1px solid var(--topbar-border);
            padding: 12px 24px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 200;
            backdrop-filter: blur(4px);
            transition: background-color 0.3s, border-color 0.3s;
        }

        #menu-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 18px;
            font-family: 'DOSFont', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        #menu-btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        /* Модальное окно (меню) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .modal h2 {
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-control {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            font-family: 'DOSFont', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-control:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        .btn-control:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .btn-control:disabled:hover {
            background: transparent;
            color: var(--text-color);
        }

        #close-menu {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }

        /* Блок управления музыкой */
        .music-control {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .music-control label {
            font-family: 'DOSFont', monospace;
            font-size: 14px;
            color: var(--text-color);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: var(--border-color);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--text-color);
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: var(--text-color);
            border: none;
            cursor: pointer;
        }

        #title-block {
            text-align: center;
            margin-bottom: 50px;
        }

        .title-line {
            border: none;
            border-top: 2px solid var(--border-color);
            margin: 20px auto;
            width: 80%;
        }

        #title {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 4px;
            color: var(--text-color);
        }

        #game-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .paragraph {
            text-align: justify;
            margin-bottom: 12px;
            white-space: pre-wrap;
            min-height: 1.6em;
        }

        .cursor {
            display: inline-block;
            animation: blink 0.8s step-end infinite;
        }

        /* Кнопки выбора */
        .choice-block {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 24px;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .choice-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 24px;
            font-family: 'DOSFont', monospace;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .choice-btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="topbar">
        <button id="menu-btn">Меню</button>
    </div>

    <!-- Затемнение и модальное окно -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <button id="close-menu">&times;</button>
            <h2>Меню</h2>
            <div class="controls">
                <button class="btn-control" id="theme-toggle">Сменить тему</button>
                <button class="btn-control" id="rollback-btn" disabled>Откатиться к выбору</button>
                <button class="btn-control" id="music-toggle">Музыка: выкл</button>
                <div class="music-control">
                    <label for="volume-slider">Громкость</label>
                    <input type="range" id="volume-slider" min="0" max="100" value="50">
                </div>
            </div>
        </div>
    </div>

    <div id="title-block">
        <hr class="title-line">
        <div id="title">JUST REMEMBER</div>
        <hr class="title-line">
    </div>
    <div id="game-container"></div>

    <!-- Аудио-элемент для эмбиента -->
    <audio id="bg-music" loop preload="auto">
        <source src="ambient.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- Структура сюжета ---
        const paragraphs = [
            "Просто представьте: вы скитаетесь по пустому бесконечному пространстве с какой-то целью, но вы идете так долго, что забыли – для чего это делаете или вернее почему?",
            "В руках у Вас странный предмет, напоминающий стеклянный короб, в котором находится непонятный кусок бумаги, на котором что-то написано, но разобрать что именно – невозможно.",
            "Открыть его является непосильной задачей. Разбить – вокруг пустота и ничего более, нет ни чего-то острого, ни чего-то твердого. Все мягкое и спокойное.",
            "Кажется, то, что находится внутри – это и есть ключ к пониманию того, что тут случилось, ключ к объяснению всего происходящего. Надежда угасла уже давно.",
            "Все дальнейшие похождения – просто привычка. Любые чувства, эмоции притупились максимально. Ни страха, ни сожаления, ни радости, ни удовлетворения. Это испытание, которое уже, казалось, было провалено.",
            "После пройденных миллионов километров по пустоте, Вы обнаруживаете выделяющееся, непохожее ни на что… (???). Вы когда-нибудь видели это?",
            "Прошло столько времени, пропало какое-либо понимание происходящего, возникает лишь два вопроса: прикоснуться или опровергнуть? Погубит или поможет? Спасет или потревожит?",
            "Появляется выбор, которого не было тогда, когда он был так важен. Прикосновение в ситуации с затупленными чувствами тактильности не вызывает ни капли сомнения, страха, вообще ничего.",
            // Первая развилка
            {
                type: "choice",
                options: [
                    {
                        label: "Прикоснуться",
                        result: [
                            "Совершенно новое пространство. Далеко не такое пустое как предыдущее. Неизменно одно – в руках стеклянный маленький короб с таинственным куском бумаги."
                        ]
                    },
                    {
                        label: "Отвергнуть",
                        result: [
                            "Нет. Вы больше не верите. Все угасло уже очень давно. Вы не хотите возвращаться к этому. Но что-то или кто-то с Вами не согласен и Вы чувствуете резкий толчок позади себя...",
                            "Совершенно новое пространство. Далеко не такое пустое как предыдущее. Неизменно одно – в руках стеклянный маленький короб с таинственным куском бумаги."
                        ]
                    }
                ]
            }
        ];

        let currentIndex = 0;
        let isTyping = false;
        let typingInterval = null;
        let choiceMade = false;
        let pendingResult = null;
        let currentTypingText = '';
        const container = document.getElementById('game-container');

        // --- Точка отката ---
        let rollbackCheckpoint = null;  // { choiceIndex, containerChildCount }
        const rollbackBtn = document.getElementById('rollback-btn');

        // --- Логика меню ---
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menu-btn');
        const closeMenuBtn = document.getElementById('close-menu');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            overlay.classList.add('active');
        });

        closeMenuBtn.addEventListener('click', () => {
            overlay.classList.remove('active');
        });

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.classList.remove('active');
            }
        });

        // --- Переключение темы ---
        const themeToggle = document.getElementById('theme-toggle');
        let isDark = false;

        themeToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            isDark = !isDark;
            const root = document.documentElement;
            if (isDark) {
                root.style.setProperty('--bg-color', '#000');
                root.style.setProperty('--text-color', '#fff');
                root.style.setProperty('--border-color', '#fff');
                root.style.setProperty('--topbar-bg', 'rgba(0, 0, 0, 0.7)');
                root.style.setProperty('--topbar-border', 'rgba(255, 255, 255, 0.3)');
            } else {
                root.style.setProperty('--bg-color', '#fff');
                root.style.setProperty('--text-color', '#000');
                root.style.setProperty('--border-color', '#000');
                root.style.setProperty('--topbar-bg', 'rgba(255, 255, 255, 0.8)');
                root.style.setProperty('--topbar-border', 'rgba(0, 0, 0, 0.3)');
            }
        });

        // --- Логика отката ---
        rollbackBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!rollbackCheckpoint) return;

            // Останавливаем печать, если идёт
            if (isTyping) {
                clearInterval(typingInterval);
                isTyping = false;
            }

            // Очищаем очередь результатов выбора
            pendingResult = null;
            choiceMade = false;

            // Удаляем все элементы после чекпоинта
            const keepCount = rollbackCheckpoint.containerChildCount;
            while (container.children.length > keepCount) {
                container.removeChild(container.lastChild);
            }

            // Возвращаем currentIndex к точке выбора
            currentIndex = rollbackCheckpoint.choiceIndex;

            // Заново показываем кнопки выбора
            const choiceObj = paragraphs[currentIndex];
            showChoice(choiceObj);

            // Закрываем меню
            overlay.classList.remove('active');
        });

        // --- Логика музыки ---
        const bgMusic = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        const volumeSlider = document.getElementById('volume-slider');
        let musicPlaying = false;

        bgMusic.volume = 0.5;

        musicToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            if (musicPlaying) {
                bgMusic.pause();
                musicPlaying = false;
                musicToggle.textContent = 'Музыка: выкл';
            } else {
                bgMusic.play().catch(err => console.log('Воспроизведение заблокировано браузером'));
                musicPlaying = true;
                musicToggle.textContent = 'Музыка: вкл';
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            e.stopPropagation();
            bgMusic.volume = volumeSlider.value / 100;
        });

        document.querySelector('.modal').addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // --- Логика текста ---
        function typeParagraph(text) {
            isTyping = true;

            const p = document.createElement('div');
            p.className = 'paragraph';
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            cursor.textContent = '_';
            p.appendChild(cursor);
            container.appendChild(p);

            let charIndex = 0;
            const speed = 30;

            typingInterval = setInterval(() => {
                if (charIndex < text.length) {
                    const char = document.createTextNode(text[charIndex]);
                    p.insertBefore(char, cursor);
                    charIndex++;
                } else {
                    clearInterval(typingInterval);
                    cursor.remove();
                    isTyping = false;
                }
            }, speed);
        }

        function skipTyping() {
            clearInterval(typingInterval);
            const lastP = container.lastElementChild;
            if (lastP && lastP.classList.contains('paragraph')) {
                lastP.textContent = currentTypingText;
            }
            isTyping = false;
        }

        function typeParagraphTracked(text) {
            currentTypingText = text;
            typeParagraph(text);
        }

        // --- Отрисовка кнопок выбора ---
        function showChoice(choiceObj) {
            // Сохраняем точку отката: сколько элементов в контейнере сейчас
            // и индекс самого выбора в массиве
            rollbackCheckpoint = {
                choiceIndex: currentIndex,
                containerChildCount: container.children.length
            };
            rollbackBtn.disabled = false;

            const choiceBlock = document.createElement('div');
            choiceBlock.className = 'choice-block';

            choiceObj.options.forEach((option) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = option.label;

                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (choiceMade) return;
                    choiceMade = true;

                    // Удаляем кнопки
                    choiceBlock.remove();

                    // Ставим в очередь результаты выбранного пути
                    pendingResult = option.result.slice();
                    // Сразу выводим первый абзац
                    const firstText = pendingResult.shift();
                    typeParagraphTracked(firstText);
                });

                choiceBlock.appendChild(btn);
            });

            container.appendChild(choiceBlock);
        }

        // --- Обработка клика по экрану ---
        document.body.addEventListener('click', () => {
            if (overlay.classList.contains('active')) return;

            if (isTyping) {
                skipTyping();
                return;
            }

            if (pendingResult && pendingResult.length > 0) {
                const nextText = pendingResult.shift();
                typeParagraphTracked(nextText);
                return;
            }

            if (currentIndex < paragraphs.length) {
                const item = paragraphs[currentIndex];

                if (typeof item === 'string') {
                    typeParagraphTracked(item);
                    currentIndex++;
                } else if (item.type === 'choice') {
                    showChoice(item);
                    currentIndex++;
                }
            }
        });
    </script>
</body>
</html>
